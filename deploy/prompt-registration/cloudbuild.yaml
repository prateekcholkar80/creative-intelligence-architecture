steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/prompt-registration/Dockerfile
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/ci-operator-images/prompt-registration:${_TAG}
      - .
images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/ci-operator-images/prompt-registration:${_TAG}
timeout: 600s
options:
  logging: CLOUD_LOGGING_ONLY
